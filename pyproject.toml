[project]
name = "pinpoint-docs"
version = "0.1.0"
description = "RAG over the FastAPI docs with citations, abstention and an eval harness"
requires-python = ">=3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
